name: vcedit
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # Core runtime (keep env.yaml small; Python + PyTorch + CUDA + pip)
  - python=3.8
  - pytorch=2.4.1=py3.8_cuda11.8_cudnn9.1.0_0
  - pytorch-cuda=11.8
  - torchvision=0.19.1=py38_cu118
  - torchaudio=2.4.1=py38_cu118
  - cudatoolkit=11.8
  - pip

